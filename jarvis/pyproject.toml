[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — Memory Core 0.1"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "langfuse>=2.0.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    # numpy>=2 (pulled transitively by chromadb/onnxruntime) crashes with SIGILL on
    # arranque en CPUs viejas sin SSSE3/SSE4/AVX (visto en vivo en el homelab: AMD
    # Athlon II X2 245, 2009 -- ver Cerebro/estado-actual.md, deploy 2026-08-26).
    # numpy 1.26.4 confirmado funcional (import + chromadb upsert/get/query reales)
    # en ese mismo host; <2 alcanza para evitar el wheel roto sin fijar una versión
    # exacta que quede vieja innecesariamente en hardware moderno.
    "numpy<2",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["jarvis*"]
