[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — Memory Core 0.1"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "langfuse>=2.0.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["jarvis*"]
