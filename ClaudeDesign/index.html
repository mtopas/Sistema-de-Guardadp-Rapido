<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>SGR — Sistema de Guardado Rápido</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style id="theme-vars">
  :root {
    /* Dark + violet base */
    --bg:        oklch(0.145 0.018 280);
    --surface:   oklch(0.185 0.022 280);
    --sidebar:   oklch(0.118 0.018 280);
    --panel-bg:  oklch(0.175 0.022 280);
    --elev:      oklch(0.215 0.025 280);

    --accent:        #8b5cf6;
    --accent-light:  #a78bfa;
    --accent-deep:   #7c3aed;

    --text:     oklch(0.96 0.005 280);
    --text-2:   oklch(0.86 0.008 280);
    --subtext:  oklch(0.62 0.012 280);
    --mute:     oklch(0.48 0.013 280);
    --border:   color-mix(in oklch, white 7%, transparent);
    --border-2: color-mix(in oklch, white 12%, transparent);

    --success: #34d399;
    --warning: #fbbf24;
    --danger:  #f87171;
    --info:    #60a5fa;
    --habit-done: #34d399;
    --income:  #34d399;
    --expense: #f87171;

    /* Branch colors (grafo / categorías / calendarios) */
    --b1:#8b5cf6; --b2:#06b6d4; --b3:#10b981; --b4:#f59e0b;
    --b5:#ef4444; --b6:#3b82f6; --b7:#f97316; --b8:#14b8a6;
    --b9:#a855f7; --b10:#f43f5e;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Sora", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Background grain + soft glow */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(60% 50% at 18% 0%, color-mix(in oklch, var(--accent) 16%, transparent) 0%, transparent 60%),
      radial-gradient(40% 35% at 100% 100%, color-mix(in oklch, var(--accent) 8%, transparent) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Type */
  .serif { font-family: "Playfair Display", "Times New Roman", serif; }
  .mono  { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "tnum"; }
  .tnum  { font-variant-numeric: tabular-nums; }

  .label {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 600; color: var(--subtext);
  }
  .grad-text {
    background: linear-gradient(130deg, var(--accent) 0%, var(--accent-light) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .grad-bg {
    background: linear-gradient(130deg, var(--accent) 0%, var(--accent-light) 100%);
  }
  .grad-soft {
    background: linear-gradient(130deg,
      color-mix(in oklch, var(--accent) 18%, transparent),
      color-mix(in oklch, var(--accent-light) 6%, transparent));
  }
  .glow { box-shadow: 0 10px 40px -10px color-mix(in oklch, var(--accent) 55%, transparent); }
  .glow-sm { box-shadow: 0 4px 16px -4px color-mix(in oklch, var(--accent) 50%, transparent); }

  .panel {
    background: color-mix(in oklch, var(--panel-bg) 92%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .panel-strong {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .surface { background: var(--surface); border-radius: 12px; }

  /* Buttons */
  .btn { display:inline-flex; align-items:center; gap:6px;
    padding: 8px 12px; border-radius: 10px; font-weight: 500; font-size: 13px;
    color: var(--text); border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; transition: all 0.15s ease; user-select:none;
  }
  .btn:hover { border-color: var(--border-2); background: var(--elev); }
  .btn:active { transform: scale(0.985); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn-ghost:hover { background: var(--surface); color: var(--text); }
  .btn-primary {
    background: linear-gradient(130deg, var(--accent), var(--accent-light));
    border-color: transparent; color: white;
    box-shadow: 0 6px 18px -6px color-mix(in oklch, var(--accent) 60%, transparent);
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-danger { background: color-mix(in oklch, var(--danger) 22%, transparent); border-color: color-mix(in oklch, var(--danger) 40%, transparent); color: var(--danger); }
  .icon-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width: 32px; height: 32px; border-radius: 10px;
    color: var(--subtext); cursor: pointer; transition: all 0.15s ease;
    border: 1px solid transparent; background: transparent;
  }
  .icon-btn:hover { background: var(--surface); color: var(--text); }

  /* Inputs */
  .input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 12px;
    font: inherit;
    transition: border-color 0.15s ease;
    outline: none;
  }
  .input:focus { border-color: var(--accent); }
  .input::placeholder { color: var(--mute); }

  /* Pills / chips */
  .chip {
    display:inline-flex; align-items:center; gap:6px;
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 500;
    background: var(--surface); color: var(--text-2); border: 1px solid var(--border);
  }
  .badge {
    display:inline-flex; align-items:center; justify-content:center;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    font-size: 10px; font-weight: 600; color: var(--subtext);
    background: var(--surface); border: 1px solid var(--border);
  }

  /* Animations */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.5; }
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.4); }
    70%  { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
  .anim-slideUp   { animation: slideUp 0.18s ease-out both; }
  .anim-fadeIn    { animation: fadeIn 0.18s ease-out both; }
  .anim-slideIn   { animation: slideInRight 0.2s ease-out both; }
  .anim-scaleIn   { animation: scaleIn 0.15s ease-out both; }
  .anim-pop       { animation: pop 0.25s ease-out both; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--accent), var(--accent-light));
    border-radius: 4px;
    opacity: 0.6;
  }
  ::-webkit-scrollbar-thumb:hover { opacity: 1; }

  /* utilities */
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus-ring:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  hr.divider {
    border: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 16px 0;
  }
</style>
