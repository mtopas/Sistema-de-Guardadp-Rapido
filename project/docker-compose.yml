# SGR en homelab — backend + bot, DB en ./database
#
# En ~/project/.env del gabinete:
#   API_BASE_URL=http://backend:8765
#
# Levantar: cd ~/project && sudo docker compose up -d --build

services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8765
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      SGR_DATA_DIR: /app
      SGR_HOST: 0.0.0.0
      SGR_PORT: "8765"
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
    restart: unless-stopped

  bot:
    build: .
    command: python mybot/bot.py
    env_file:
      - .env
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8765}
    depends_on:
      - backend
    restart: unless-stopped
