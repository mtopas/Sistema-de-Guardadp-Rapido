# Bot en homelab → API + DB en Windows (Modo B — una sola SQLite en la PC)
#
# En Windows (PowerShell, desde project/):
#   uvicorn app.main:app --reload --host 0.0.0.0 --port 8765
#
# En el gabinete:
#   cd ~/project
#   sudo docker compose -f docker-compose.bot-only.yml up -d --build
#   sudo docker compose -f docker-compose.bot-only.yml logs -f bot
#
# API_BASE_URL: gateway ICS de Windows. Si cambia la red, ajustá en .env del homelab.

services:
  bot:
    build: .
    command: python mybot/bot.py
    env_file:
      - .env
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://192.168.137.1:8765}
    restart: unless-stopped
