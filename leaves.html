<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Atomic Habits Card</title>
  <style>
    body {
      background-color: #0f0b1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      width: 520px;
      background: #1b1230;
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    .icon {
      width: 42px;
      height: 42px;
      background: #b8f3c6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #1b1230;
      flex-shrink: 0;
    }

    .content {
      flex: 1;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .tags {
      display: flex;
      gap: 8px;
    }

    .tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #2a1f4a;
      color: #cfc3ff;
    }

    .tag.primary {
      background: #1f3d2b;
      color: #7ef5a5;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #9b8fcf;
      font-size: 13px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #7ef5a5;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .menu {
      font-size: 18px;
      cursor: pointer;
      opacity: 0.7;
    }

    .menu:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">📄</div>       <!-- Quiero íconos, no quiero emojis -->

    <div class="content">
      <div class="title">Atomic Habits - resumen de ideas clave</div>
      <div class="tags">
        <div class="tag primary">● note</div>      <!-- Categoría -->
        <div class="tag">#libros</div>            <!-- Temas con # -->
        <div class="tag">#productividad</div>   
      </div>
    </div>

    <div class="right">
      <div>3d</div>                   <!-- Días del último edit / días desde creación si nunca editado -->
      <div class="menu">⋯</div>
    </div>
  </div>

</body>
</html>
